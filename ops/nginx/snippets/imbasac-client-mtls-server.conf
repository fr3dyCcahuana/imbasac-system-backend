# SERVER context only, after public HTTPS server certificate configuration.
# Not installed automatically. Keep role exemptions: backend decides after individual login.
ssl_verify_client optional;
ssl_verify_depth 2;
ssl_client_certificate /etc/imbasac/pki/public/device-trust.pem;
ssl_crl /etc/imbasac/pki/public/device-crls.pem;
# Public TLS protocols remain in the existing reviewed Let's Encrypt configuration.
