# Replace the content of the current /api/ proxy location with a reviewed merge.
# Preserve the trailing slash rewrite: /api/auth/login -> /auth/login.
proxy_pass https://127.0.0.1:8091/;
proxy_ssl_certificate /etc/imbasac/pki/internal/nginx-client-chain.pem;
proxy_ssl_certificate_key /etc/imbasac/pki/internal/nginx-client.key;
proxy_ssl_trusted_certificate /etc/imbasac/pki/internal/root.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_server_name on;
proxy_ssl_name localhost;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_set_header Host $host;
proxy_set_header X-Imbasac-Client-IP $remote_addr;
proxy_set_header X-Imbasac-Client-Verify $ssl_client_verify;
proxy_set_header X-Imbasac-Client-Cert $ssl_client_escaped_cert;
proxy_set_header X-Imbasac-Request-ID $request_id;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_read_timeout 3600s;
proxy_send_timeout 60s;
# Request URIs may contain legacy SSE credentials: use a log format with $uri, never $request/$args.
