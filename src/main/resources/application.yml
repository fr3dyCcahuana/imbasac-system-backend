whatsapp:
  # Versión de Graph API que estás usando en Meta Developers.
  api-version: v25.0

  # ID del número de WhatsApp, NO es el número telefónico.
  # Sale en Meta: Configuración de la API → Identificador de número de teléfono.
  phone-number-id: 1176916348827692

  # Token Bearer de Meta.
  # Para pruebas puedes usar el temporal.
  # En producción debe ser token permanente desde System User.
  access-token: "EAAiZAsuwfhKkBRRL2o7ykjs1v79zxtMa11WZBOHrDGTIITMvcbOYhZBGYpeGzeEdUmTtoDdU7awfxS41CBqZBGbxyCx5QZChumqboDKfjsVB54aZCUSNZCCMZAQtZA7y2BcPnDuAynou0ZCrKCMHZAUd9TkWeXKdcdxERppy4Vj7cp6oFhijyythwUIDbR2FqW5ZCVFh7qrKympiw3fz3ONRHbuvlaBExw50b3mlsL9t5jkaKwCvtN32nfOJzj2LZAseDYIRfgIypLAhnDQl80lC0SFrg"

  # Token inventado por ti para validar el webhook.
  # Este mismo valor debes colocarlo en Meta cuando configures Webhook.
  verify-token: imbasac-whatsapp-webhook-token

  # true = responde automático cuando entra un mensaje.
  # false = solo guarda mensajes, no responde.
  auto-reply-enabled: ${WHATSAPP_AUTO_REPLY_ENABLED:true}

  # Tamaño por defecto para listar conversaciones/mensajes en el frontend.
  default-page-size: 20
  sales:
    send-product-images: true
    product-images-base-url: https://imbasac.cloud/images/products
    default-price-list: ${WHATSAPP_DEFAULT_PRICE_LIST:B}
    show-stock: ${WHATSAPP_SHOW_STOCK:true}
    max-products-response: ${WHATSAPP_MAX_PRODUCTS_RESPONSE:10}
    only-show-products-with-stock: ${WHATSAPP_ONLY_SHOW_PRODUCTS_WITH_STOCK:false}
    minimum-stock-to-show: ${WHATSAPP_MINIMUM_STOCK_TO_SHOW:1}
    allow-proforma-generation: ${WHATSAPP_ALLOW_PROFORMA_GENERATION:true}
    proforma-station-id: ${WHATSAPP_PROFORMA_STATION_ID:28}
    proforma-created-by: ${WHATSAPP_PROFORMA_CREATED_BY:32}
    proforma-created-by-username: ${WHATSAPP_PROFORMA_CREATED_BY_USERNAME:}
    proforma-series: ${WHATSAPP_PROFORMA_SERIES:P001}
    proforma-tax-status: ${WHATSAPP_PROFORMA_TAX_STATUS:NO_GRAVADA}
    proforma-igv-rate: ${WHATSAPP_PROFORMA_IGV_RATE:18.00}
    proforma-igv-included: ${WHATSAPP_PROFORMA_IGV_INCLUDED:false}
    batch-list-enabled: ${WHATSAPP_BATCH_LIST_ENABLED:true}
    max-batch-codes-per-message: ${WHATSAPP_MAX_BATCH_CODES_PER_MESSAGE:80}
    default-batch-quantity: ${WHATSAPP_DEFAULT_BATCH_QUANTITY:10}
  ai-agent:
    enabled: ${WHATSAPP_AI_AGENT_ENABLED:true}
    base-url: ${WHATSAPP_AI_AGENT_BASE_URL:http://localhost:8010}
    api-key: ${WHATSAPP_AI_AGENT_API_KEY:dev-secret}
    plan-path: ${WHATSAPP_AI_AGENT_PLAN_PATH:/api/v1/agent/plan}
    connect-timeout-seconds: ${WHATSAPP_AI_AGENT_CONNECT_TIMEOUT_SECONDS:2}
    read-timeout-seconds: ${WHATSAPP_AI_AGENT_READ_TIMEOUT_SECONDS:8}
  vision:
    enabled: ${WHATSAPP_VISION_ENABLED:false}
    open-ai-api-key: ${OPENAI_API_KEY:}
    open-ai-model: ${OPENAI_VISION_MODEL:gpt-4o-mini}
    max-media-bytes: ${WHATSAPP_VISION_MAX_MEDIA_BYTES:5242880}
  campaign:
    enabled: true
    require-policy-confirmation: true
    only-opted-in-by-default: true
    max-recipients-per-campaign: 100
    delay-millis-between-messages: 1000
  debug:
    simulation-enabled: true
    simulation-wa-prefix: SIM_

