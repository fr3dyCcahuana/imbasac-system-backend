spring:
  application:
    name: pos-system-backend

  datasource:
    url: ${IMBASAC_SPRING_DATASOURCE_URL}
    username: ${IMBASAC_SPRING_DATASOURCE_USERNAME}
    password: ${IMBASAC_SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 10000

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2MB

server:
  port: 8091
  address: 127.0.0.1
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

  file:
    name: /opt/pos-backend/pos-backend.log

  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB

security:
  token:
    secret: ${IMBASAC_SECURITY_TOKEN_SECRET}
    expiration: 2400
  session:
    ttl: 21600

  # Release defaults: enable only through the reviewed external security configuration.
  access-control:
    enabled: false
    strike-threshold: 3
    incident-cooldown-seconds: 60
  access-audit:
    enabled: false
  device-policy:
    enabled: false
    individual-enabled: false
  device-certificates:
    enabled: false
    enrollment-enabled: false
    issuer-bundle-path: ${IMBASAC_DEVICE_ISSUER_BUNDLE:}
  ca-signer:
    enabled: false
    transport: linux-local
    revocation-delivery-enabled: false
  trusted-proxy:
    enabled: false
    certificate-sha256: ${IMBASAC_NGINX_CERT_SHA256:}
  sunat-files:
    enabled: false
  geoip:
    enabled: false

integration:
  mtc-license:
    assisted:
      enabled: ${MTC_ASSISTED_ENABLED:true}
      search-url: https://licencias.mtc.gob.pe/#/index
      session-ttl-seconds: 180
    search-url: https://slcp.mtc.gob.pe/
    headless: true
    timeout-ms: 30000
    session-ttl-seconds: 120
    debug-enabled: false
    network-log-enabled: false
    debug-dir: /var/log/pos-backend/mtc-debug
    proxy-enabled: true
    proxy-server: socks5://127.0.0.1:1080
    proxy-bypass: localhost,127.0.0.1
  customer-lookup:
    proxy-enabled: true
    proxy-server: socks5://127.0.0.1:1080
    connect-timeout-ms: 30000
    read-timeout-ms: 60000

  guide-remission:
    base-url: http://127.0.0.1:8093/API_SUNAT_GUIAS
    connect-timeout-seconds: 10
    read-timeout-seconds: 90
    ticket-query-delay-millis: 20000
    token-ttl-skew-seconds: 60
    cached-token-ttl-seconds-fallback: 3300

    auth:
      guias-client-id: ${IMBASAC_INTEGRATION_GUIDE_REMISSION_AUTH_GUIAS_CLIENT_ID}
      guias-client-secret: ${IMBASAC_INTEGRATION_GUIDE_REMISSION_AUTH_GUIAS_CLIENT_SECRET}
      usu-secundario-produccion-user: ${IMBASAC_INTEGRATION_GUIDE_REMISSION_AUTH_USU_SECUNDARIO_PRODUCCION_USER}
      usu-secundario-produccion-password: ${IMBASAC_INTEGRATION_GUIDE_REMISSION_AUTH_USU_SECUNDARIO_PRODUCCION_PASSWORD}

    company:
      ruc: "20527826358"
      razon-social: "IMPORTACIONES BAEZ SOCIEDAD ANONIMA CERRADA"
      nombre-comercial: "IMBA S.A.C."
      domicilio-fiscal: "AV. TAMBOPATA 854"
      ubigeo: "170101"
      urbanizacion: "-"
      distrito: "TAMBOPATA"
      provincia: "TAMBOPATA"
      departamento: "MADRE DE DIOS"
      modo: 1

sale:
  sunat:
    mode: "1"
    url: http://127.0.0.1:8093/API_SUNAT/post.php
    username: ${IMBASAC_SALE_SUNAT_USERNAME}
    password: ${IMBASAC_SALE_SUNAT_PASSWORD}
    business:
      ruc: "20527826358"
      businessName: "IMPORTACIONES BAEZ SOCIEDAD ANONIMA CERRADA"
      tradeName: "IMBA S.A.C."
      taxAddress: "AV. TAMBOPATA 854"
      ubigeo: "170101"
      neighborhood: "-"
      district: "TAMBOPATA"
      province: "TAMBOPATA"
      department: "MADRE DE DIOS"

common:
  hashedPassword: ${IMBASAC_COMMON_HASHEDPASSWORD}

app:
  customer-map:
    map:
      google-maps-api-key: ${GOOGLE_MAPS_API_KEY:}
      google-maps-map-id: ${GOOGLE_MAPS_MAP_ID:81d711e1d002638abc802d69}
      bounds: [-81.5, -18.5, -68.5, 0.5]
      center: [-75.0152, -9.19]
      min-zoom: 4
      max-zoom: 22
      urban-zoom: 18
    geocoder:
      enabled: true
      provider: NOMINATIM
      base-url: https://nominatim.openstreetmap.org
      timeout-ms: 8000
      rate-limit-per-minute: 4
      max-retries: 1
      country: PE
      language: es
      user-agent: IMBASAC customer map geocoder
      batch-enabled: true
      auto-job:
        enabled: true
        cron: "0 */5 * * * *"
        batch-size: 20
  whatsapp-agent:
    base-url: http://127.0.0.1:8092
  files:
    products-images-dir: /var/www/images/products
    products-images-public-path: /images/products
    products-images-base-url: http://imbasac.cloud/images/products
    promotions-images-dir: /var/www/images/promotions
    promotions-images-public-path: /images/promotions
    manual-pdfs-dir: /var/www/files/manual-pdfs
    manual-pdfs-public-path: /files/manual-pdfs
    community-dir: /var/www/files/community
    community-public-path: /files/community
    company-community-dir: /var/www/files/company-community
    company-community-public-path: /files/company-community
    sunat-xml-public-path: /sunat-files/xml
    sunat-cdr-public-path: /sunat-files/cdr
  document-series:
    documents:
      SIMPLE:
        default-series: S001
        allowed-series:
          - S001
      VENTANILLA:
        default-series: V001
        allowed-series:
          - V001
      PROFORMA:
        default-series: P001
        allowed-series:
          - P001
      CONTRACT:
        default-series: C001
        allowed-series:
          - C001
          - C002
      GUIDE_REMISSION:
        default-series: T001
        allowed-series:
          - T001
      BOLETA:
        default-series: B003
        allowed-series:
          - B003
          - B004
      FACTURA:
        default-series: F003
        allowed-series:
          - F003
          - F004
      NOTA_CREDITO_FACTURA:
        default-series: FC01
        allowed-series:
          - FC01
      NOTA_CREDITO_BOLETA:
        default-series: BC01
        allowed-series:
          - BC01
